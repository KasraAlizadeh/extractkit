[project]
name = "extractkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kasra Alizadeh", email = "dev.kasra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
extractkit = "extractkit:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.13",
]
